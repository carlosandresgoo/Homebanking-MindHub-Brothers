server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # API calls go to the Spring Boot container (same origin for the browser, so no CORS needed).
    # The backend sets its own security headers.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite (not append): the backend rate-limits login per client IP taken from this header,
        # so a client-supplied X-Forwarded-For must never reach it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        expires 1y;
    }

    # SPA fallback: unknown paths are handled by the Angular router.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
