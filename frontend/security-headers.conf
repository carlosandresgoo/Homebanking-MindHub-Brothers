# Included in every static location: nginx drops server-level add_header directives
# in any location that declares its own add_header.
# inlineCritical is disabled in angular.json so no inline handler is needed; 'unsafe-inline' for styles
# covers Angular's runtime style injection; data: allows Bootstrap's inline SVG icons.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
