<!DOCTYPE html>
<!--/* Shared frame for every e-mail: each template passes its <main> as "content". */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="email(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">MindHub Brothers</title>
    <style>
        body { margin: 0; padding: 0; background: #eef2f8; color: #1b1f27;
               font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.55; }
        .frame { max-width: 600px; margin: 0 auto; padding: 24px 12px; }
        .card { background: #ffffff; border-radius: 16px; overflow: hidden; }
        .brand { background: linear-gradient(135deg, #0b57d0 0%, #00838f 100%); color: #ffffff;
                 padding: 22px 32px; font-size: 18px; font-weight: 600; letter-spacing: .2px; }
        .body { padding: 28px 32px 32px; }
        h1 { font-size: 20px; margin: 0 0 16px; }
        .amount { font-size: 30px; font-weight: 700; margin: 8px 0 20px; }
        .debit { color: #b3261e; }
        .credit { color: #146c2e; }
        table.details { width: 100%; border-collapse: collapse; background: #f4f6fb; border-radius: 12px; margin: 16px 0; }
        table.details td { padding: 10px 16px; border-bottom: 1px solid #e3e7ef; }
        table.details tr:last-child td { border-bottom: 0; }
        table.details td:first-child { color: #5b6270; width: 45%; }
        .note { border-left: 4px solid #0b57d0; background: #f4f6fb; padding: 12px 16px; margin: 16px 0; border-radius: 4px; }
        .warning { border-left-color: #b3261e; background: #fcf1f0; }
        .button { display: inline-block; background: #0b57d0; color: #ffffff !important; text-decoration: none;
                  padding: 12px 24px; border-radius: 999px; font-weight: 600; margin: 8px 0; }
        .muted { color: #5b6270; font-size: 13px; }
        .footer { text-align: center; color: #5b6270; font-size: 12px; padding: 20px 12px 0; }
    </style>
</head>
<body>
<div class="frame">
    <div class="card">
        <div class="brand">MindHub Brothers</div>
        <div class="body">
            <p>Hola <strong th:text="${name}">Melba</strong>:</p>
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
    <div class="footer">
        <p>Este es un mensaje automático: no lo respondas.<br>
            MindHub Brothers nunca te va a pedir tu contraseña, códigos de verificación ni datos de tus tarjetas.</p>
    </div>
</div>
</body>
</html>
