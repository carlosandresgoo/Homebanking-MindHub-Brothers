<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(~{::main})}">
<body>
<main>
    <h1>Tu plazo fijo venció</h1>
    <div class="amount credit" th:text="${total}">$ 10.287,67</div>
    <table class="details" role="presentation">
        <tr><td>Capital</td><td th:text="${principal}">$ 10.000,00</td></tr>
        <tr><td>Intereses</td><td th:text="${interest}">$ 287,67</td></tr>
        <tr><td>Acreditado en</td><td th:text="${account}">VIN-12345678</td></tr>
    </table>
    <p th:if="${renewedMaturity}">Como tenías la renovación automática activada, reinvertimos el total en un nuevo
        plazo fijo que vence el <strong th:text="${renewedMaturity}">28/11/2026</strong>.</p>
    <p th:unless="${renewedMaturity}">El dinero ya está disponible en tu cuenta.</p>
    <p><a class="button" th:href="${investmentsUrl}" href="#">Ver mis plazos fijos</a></p>
</main>
</body>
</html>
