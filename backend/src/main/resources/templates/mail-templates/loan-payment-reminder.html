<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #ff9800; color: white; padding: 20px; text-align: center; }
        .alert { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin: 15px 0; }
        .footer { text-align: center; color: #999; font-size: 12px; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📅 Recordatorio: Cuota de préstamo próxima</h2>
        </div>
        <div style="padding: 20px;">
            <p>Hola <strong th:text="${clientName}">Cliente</strong>,</p>

            <div class="alert">
                <p style="margin: 0;"><strong>Tienes una cuota por pagar.</strong></p>
            </div>

            <p><strong>Detalles:</strong></p>
            <ul>
                <li>Préstamo: <span th:text="${loanType}">Personal</span></li>
                <li>Monto: <span th:text="${amount}">$1.000,00</span></li>
                <li>Vencimiento: <span th:text="${dueDate}">15/10/2024</span></li>
            </ul>

            <p>Podés pagarla desde tu cuenta en cualquier momento.</p>

            <p style="text-align: center;">
                <a th:href="${loansUrl}" style="display: inline-block; background: #ff9800; color: white; padding: 10px 25px; text-decoration: none; border-radius: 5px;">
                    Pagar ahora
                </a>
            </p>
        </div>
        <div class="footer">
            <p>MindHub Brothers | Banca Digital Argentina</p>
        </div>
    </div>
</body>
</html>
