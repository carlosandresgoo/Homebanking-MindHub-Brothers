spring:
  application:
    name: homebanking
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  thymeleaf:
    # Only renders e-mails: the API has no server-side views, so MVC view resolution stays off.
    enabled: false
    prefix: classpath:/templates/mail/
  mail:
    # SMTP delivery only when MAIL_HOST is set (see SmtpMailer); without it dev logs the e-mails and prod
    # drops them with a warning. Short timeouts: delivery runs after commit, on the request thread.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  # Honour X-Forwarded-* from the nginx reverse proxy (client IP for rate limiting, scheme for cookies).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # An SMTP outage must not mark the API as down (e-mails are best effort).
      enabled: false
  info:
    env:
      enabled: false

app:
  # Public URL of the Angular app, used in links sent by e-mail (e.g. password reset).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: "${MAIL_FROM:MindHub Brothers <no-reply@mindhub.local>}"
  security:
    jwt:
      # Base64-encoded HMAC key, at least 256 bits. Required outside the dev profile.
      secret: ${JWT_SECRET:}
      issuer: homebanking
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      cookie-name: refresh_token
      cookie-secure: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    login-rate-limit:
      capacity: 5
      period: 1m
    account-lockout:
      max-attempts: 5
      duration: 15m
    two-factor:
      # Base64 AES key (256 bits) that encrypts the stored TOTP secrets. Required outside dev/test.
      encryption-key: ${TOTP_ENCRYPTION_KEY:}
      # Name shown in the authenticator app.
      issuer: MindHub Brothers
  banking:
    zone: America/Argentina/Buenos_Aires
    transfers:
      # Amounts in ARS, to other clients' accounts, per client and calendar day.
      daily-limit: 200000
      daily-limit-with-second-factor: 1000000
      second-factor-threshold: 50000
    fixed-terms:
      min-amount: 1000
      # Every day at 00:05 (bank time zone).
      payout-cron: "0 5 0 * * *"
    scheduled-transfers:
      # Every day at 06:00 (bank time zone), after the fixed-term payouts.
      cron: "0 0 6 * * *"
      max-open: 20

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # File-based so data survives restarts (./data relative to the working directory, git-ignored).
    # WRITE_DELAY=0: every commit hits the disk immediately, so an abrupt stop (IntelliJ "Stop") loses nothing.
    # Delete the data folder to start from scratch; override with DEV_DB_URL (e.g. jdbc:h2:mem:homebanking).
    url: ${DEV_DB_URL:jdbc:h2:file:./data/homebanking;WRITE_DELAY=0}
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt:
      # Without JWT_SECRET, dev keeps its random signing key here so sessions survive restarts.
      dev-key-file: ./data/dev-jwt.key
    two-factor:
      dev-key-file: ./data/dev-totp.key
    refresh-token:
      # Plain http on localhost during development.
      cookie-secure: false
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  banking:
    transfers:
      # Lower than production so the 2FA prompt can be tried with the seeded balances.
      second-factor-threshold: 10000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
