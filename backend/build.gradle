plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dependency.management)
	alias(libs.plugins.owasp.dependencycheck)
}

group = 'com.mindhub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
	}
}

repositories {
	mavenCentral()
}

// Reproducible builds: resolved versions are pinned in gradle.lockfile.
// After changing dependencies run: ./gradlew :backend:dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation libs.spring.boot.starter.actuator
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.oauth2.resource.server
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.validation
	implementation libs.spring.boot.starter.web
	implementation libs.flyway.core
	implementation libs.flyway.database.postgresql
	implementation libs.bucket4j.core
	runtimeOnly libs.h2
	runtimeOnly libs.postgresql
	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.security.test
	testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
	useJUnitPlatform()
}

dependencyCheck {
	// Free key from https://nvd.nist.gov/developers/request-an-api-key; without it the NVD download is slow.
	def nvdApiKey = System.getenv('NVD_API_KEY')
	if (nvdApiKey) {
		nvd {
			apiKey = nvdApiKey
		}
	}
	failBuildOnCVSS = 7.0f
	suppressionFile = 'dependency-check-suppressions.xml'
	analyzers {
		assemblyEnabled = false
		nodeEnabled = false
		nodeAuditEnabled = false
	}
}
