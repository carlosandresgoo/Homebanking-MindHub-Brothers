# Production-like stack. Secrets come from a local .env file (git-ignored); see .env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homebanking
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d homebanking"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/homebanking
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Same-origin deployment behind nginx: no cross-origin callers.
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: only reachable through the frontend's nginx (/api).
    expose:
      - "8080"

  frontend:
    build:
      context: frontend
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  db-data:
